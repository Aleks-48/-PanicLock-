name: paniclock-mvp
services:
  bank:
    build: ./backend
    volumes:
      - ledger:/data
    healthcheck:
      test: ["CMD","python","-c","import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 15
  web:
    build: .
    ports:
      - "127.0.0.1:${PANICLOCK_PORT:-3080}:3000"
    depends_on:
      bank:
        condition: service_healthy
volumes:
  ledger:
